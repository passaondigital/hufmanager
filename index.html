<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes" />
    <title>HufManager — Software für Hufbearbeiter</title>
    <meta name="description" content="HufManager ist die Branchensoftware für Hufbearbeiter. Kunden, Pferde, Termine, Rechnungen und Touren — alles in einer App." />
    <meta name="author" content="Pascal Schmid / Barhufserviceschmid" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icon-96.png" />

    <!-- iOS / Apple PWA -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HufManager" />

    <!-- Theme Color (Browser Bar & PWA) -->
    <meta name="theme-color" content="#0a0700" />
    <meta name="msapplication-TileColor" content="#0a0700" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="HufManager — Software für Hufbearbeiter" />
    <meta property="og:description" content="Kunden, Pferde, Termine, Rechnungen und Touren — alles in einer App. Ab 9,90 € / Monat." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://app.hufmanager.de" />
    <meta property="og:site_name" content="HufManager" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:title" content="HufManager — Software für Hufbearbeiter" />
    <meta name="twitter:description" content="Kunden, Pferde, Termine, Rechnungen und Touren — alles in einer App." />


    <!-- DNS Prefetch & Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://vnschgjxkzzwzefqlrji.supabase.co" />
    <link rel="preconnect" href="https://vnschgjxkzzwzefqlrji.supabase.co" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600;700&family=Lora:wght@400;600;700&family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600;700&family=Playfair+Display:wght@400;600;700&family=Roboto:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />

    <!-- Sentry Error Monitoring (CDN, deferred so React loads first) -->
    <script
      crossorigin="anonymous"
      defer
    ></script>
    <script defer>
      document.addEventListener('DOMContentLoaded', function() {
        window.Sentry && Sentry.init({
          environment: window.location.hostname === "app.hufmanager.de" ? "production" : "development",
          tracesSampleRate: 0.1,
          release: "hufi@2.5.0"
        });
      });
    </script>
  </head>

  <body>
    <div id="root"><div id="hufi-boot-fallback" style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#FFFFFF;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:24px;text-align:center;box-sizing:border-box;">
      <style>
        @keyframes hufi-boot-spin { to { transform: rotate(360deg); } }
        #hufi-boot-spinner {
          width: 40px; height: 40px; border-radius: 50%;
          border: 3px solid #F3E8DC; border-top-color: #F97316;
          animation: hufi-boot-spin 0.9s linear infinite;
        }
      </style>
      <div id="hufi-boot-spinner"></div>
      <div>
        <div style="font-size:20px;font-weight:800;color:#1A1A1A;letter-spacing:-0.02em;margin-bottom:6px;">Hufi</div>
        <p id="hufi-boot-message" style="font-size:14px;color:#6B7280;margin:0;max-width:320px;">Einen Moment — Hufi wird geladen …</p>
      </div>
      <div id="hufi-boot-timeout-actions" style="display:none;">
        <button onclick="window.location.reload()" style="font-size:14px;font-weight:600;color:#fff;background:#F97316;border:none;border-radius:8px;padding:10px 20px;cursor:pointer;">
          Seite neu laden
        </button>
      </div>
    </div></div>
    <script>
      (function () {
        // Statisches Fallback, unabhängig vom React-Bundle: greift, wenn die
        // App aus irgendeinem Grund nicht mountet (z.B. Fehler beim Modul-Init,
        // BEVOR React überhaupt rendert — React ersetzt #root beim Mount und
        // entfernt dieses Markup automatisch, wenn alles gut geht).
        setTimeout(function () {
          var el = document.getElementById("hufi-boot-fallback");
          if (!el) return; // React hat schon erfolgreich gemountet
          var msg = document.getElementById("hufi-boot-message");
          if (msg) msg.textContent = "Hufi ist gerade nicht erreichbar. Bitte lade die Seite neu.";
          var spinner = document.getElementById("hufi-boot-spinner");
          if (spinner) spinner.style.display = "none";
          var actions = document.getElementById("hufi-boot-timeout-actions");
          if (actions) actions.style.display = "block";
        }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
