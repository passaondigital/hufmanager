# WICHTIG: Dieser Workflow baut NUR (+ optionale DB-Migration) und deployt
# NICHT auf hufiapp.de. Er läuft ohne VITE_-Secrets, das Build-Artifact ist
# also NIE für einen echten Deploy geeignet (fehlende Supabase-URL/-Key
# führen zu genau dem weißen-Screen-Fehlertyp vom 19.07.2026). Der einzige
# erlaubte Produktions-Deploy-Weg ist ./deploy.sh auf dem Server — siehe
# HUFI_ROADMAP.md ("Ausfall 19.07.2026") und ROBUSTHEIT_ANALYSE.md.
name: CI Build-Check (kein Live-Deploy)

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build frontend (nur Artifact, deployt nicht)
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '20'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist

  db-migrate:
    name: Deploy Supabase migration (optional)
    runs-on: ubuntu-latest
    needs: build
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run migration SQL if DATABASE_URL present
        if: env.DATABASE_URL != ''
        run: |
          echo "Running migration against DATABASE_URL"
          psql "$DATABASE_URL" -f supabase/migrations/20260226_emergency_first_aid_system.sql
