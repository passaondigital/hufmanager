# WICHTIG: Dieser Workflow ist ausschließlich CI/Qualitätssicherung.
# Er deployt NICHT auf hufmanager.de oder hufiapp.de und enthält keine
# Produktions-Secrets. Der einzige erlaubte Produktions-Deploy-Weg ist
# ./deploy.sh direkt auf dem Hostinger VPS — siehe DEPLOYMENT_GUIDE.md,
# HUFI_ROADMAP.md und ROBUSTHEIT_ANALYSE.md.
name: HufManager CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: hufmanager-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend (kein Deploy)
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '20'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Tour utility tests
        run: npx vitest run src/components/slim/slimTourUtils.test.ts

  db-migrate:
    # Historischer optionaler Migrationspfad. Läuft niemals auf Pull Requests.
    # Produktion bleibt unabhängig davon: DB-Änderungen werden bewusst und
    # kontrolliert nach Release-Plan ausgeführt.
    name: Deploy Supabase migration (optional, main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        if: env.DATABASE_URL != ''
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run migration SQL if DATABASE_URL present
        if: env.DATABASE_URL != ''
        run: |
          echo "Running explicitly configured migration against DATABASE_URL"
          psql "$DATABASE_URL" -f supabase/migrations/20260226_emergency_first_aid_system.sql

      - name: Skip when no database secret is configured
        if: env.DATABASE_URL == ''
        run: echo "DATABASE_URL not configured; no database change performed."
